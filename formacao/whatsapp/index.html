  <p>Se o WhatsApp não abrir sozinho, toque no botão abaixo.</p>
  <a class="btn" id="ir" href="https://wa.me/5511965419449?text=Ol%C3%A1%21%20Quero%20saber%20mais%20sobre%20a%20Forma%C3%A7%C3%A3o%20em%20Virtologia.">Falar com a equipe no WhatsApp</a>
</div>
<script src="../../js/origem.js"></script>
<script>
/* Link de WhatsApp rastreável da Formação em Virtologia.
   Use em lugares fora do site, trocando o "o":
   /formacao/whatsapp/?o=aula-gravada  /?o=aula-ao-vivo  /?o=bio  /?o=minicurso
   A mensagem chega com "(Cheguei pela aula gravada)" etc., e o clique é medido. */
(function () {
  var a = document.getElementById("ir"), O = window.IVOrigem;
  if (!O) return;
  var q = new URLSearchParams(location.search), o = (q.get("o") || "").toLowerCase();
  var canal = /gravada/.test(o) ? "aula_gravada" : /vivo/.test(o) ? "aula_ao_vivo" : /bio/.test(o) ? "link_bio" : /minicurso/.test(o) ? "minicurso" : (o.replace(/[^a-z0-9_-]/g, "") || O.canalAtual());
  a.href = O.comOrigem(a.getAttribute("href"), "", canal);
  O.medirWhats("link_rastreavel", canal);
  setTimeout(function () { location.replace(a.href); }, 450);
})();
</script>
