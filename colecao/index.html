/* /colecao/ : link curto para o pagamento da Coleção Especial · 14 obras (Greenn).

  var a = document.getElementById("ir"), O = window.IVOrigem;
  if (O && O.decorar) a.href = O.decorar(a.href);
  try { if (window.fbq) fbq("track", "InitiateCheckout", { content_name: "Coleção Especial · 14 obras", origem_link: "colecao" }); } catch (e) {}

})();
